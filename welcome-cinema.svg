<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Abstract cinematic light</title>
  <desc id="desc">A copyright-safe abstract composition of cinema light and warm gold frames.</desc>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17151b"/>
      <stop offset="0.52" stop-color="#30251f"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="32%" r="62%">
      <stop offset="0" stop-color="#d9a85f" stop-opacity="0.72"/>
      <stop offset="0.42" stop-color="#a76e3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d39a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f6d39a" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <path d="M1240 80 390 1000h420L1435 80Z" fill="url(#beam)" filter="url(#blur)"/>
  <path d="M1410 0 690 1000h150L1515 0Z" fill="#f6d39a" opacity="0.08"/>
  <g fill="none" stroke="#e3b66f" opacity="0.22">
    <rect x="920" y="270" width="420" height="270" rx="14" stroke-width="2" transform="rotate(-8 1130 405)"/>
    <rect x="965" y="315" width="420" height="270" rx="14" stroke-width="1" transform="rotate(-8 1175 450)"/>
    <circle cx="1110" cy="410" r="78" stroke-width="2"/>
    <circle cx="1110" cy="410" r="28" stroke-width="1"/>
  </g>
  <g fill="#f6d39a" opacity="0.4">
    <circle cx="1110" cy="332" r="7"/>
    <circle cx="1188" cy="410" r="7"/>
    <circle cx="1110" cy="488" r="7"/>
    <circle cx="1032" cy="410" r="7"/>
  </g>
</svg>
